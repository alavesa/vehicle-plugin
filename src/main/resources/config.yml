# BetterModel integration: when the BetterModel plugin is installed, vehicle .bbmodel files are mirrored into
# plugins/BetterModel/models (prefix vehicle_) so BetterModel builds the one resource pack for the server, and
# vehicle bodies + driving animations are rendered by BetterModel (entity animations with Blockbench semantics).
# Set enabled: false to keep using this plugin's own pack generator and ItemDisplay bodies.
bettermodel:
  enabled: true
  # Extra model yaw (degrees) under BetterModel, on top of each type's model-yaw. BetterModel already turns every
  # model 180 degrees (Blockbench north = front), exactly what model-yaw 180 did before, so 0 keeps cars facing as
  # they did; set 180 here if a model comes out backwards. The model scale = the type's scale (the base entity's
  # own scale attribute, which is the hitbox, is ignored).
  yaw-offset: 0

# Driving animations per type (types.yml animations: idle/drive/reverse/left/right/reverse_left/reverse_right, set
# with /vehicle edit <car> animation <state> <name>). Unset states fall back: left/right/reverse -> drive,
# reverse_left -> reverse -> left -> drive. Under BetterModel the sync also moves every free-rotated cube of a
# .bbmodel into its own bone (BetterModel approximates free cube rotations and deforms them); /vehicle check <model>
# shows what the BetterModel copy contains.

# Body physics: four corner probes read the ground under the car and the body tilts to that plane (slopes, stairs,
# ramps); airborne it keeps its spin and the nose follows the flight path; a crash at >= flip-speed blocks/s can roll
# it over (flip-chance), and past tip-angle it lands on its roof: no driving, riders are put out, sneak + right-click
# turns it back. pitch-sign / roll-sign: set -1 if a tilt shows mirrored on your models. Under BetterModel only
# pitch and "on the roof" can be shown (its API has no roll).
physics:
  enabled: true
  tilt-rate: 0.25          # how fast the body settles onto the ground plane (fraction per tick)
  max-ground-tilt: 50      # degrees of slope the body follows
  air-pitch-rate: 0.08
  flip-speed: 8.0
  flip-chance: 0.6
  flip-torque: 11.0        # degrees per tick of roll a flipping crash gives
  tip-angle: 95            # roll beyond this when touching down = on the roof
  pitch-sign: 1
  roll-sign: 1

# Seats: seat 1 is the driver on the LEFT (x negative = left, positive = right, z positive = forward, in blocks before
# the type's scale). /vehicle edit <car> seats <n> adds seats on an even grid (left, right, next row) skipping any spot
# an existing seat occupies; /vehicle edit <car> seat <n> <x> <y> <z> moves one; overlaps are reported.

# Vehicle plugin configuration
#
# Models: put your Blockbench files into plugins/Vehicle/models/<name>.bbmodel and restart the server
# (or run /vehicle pack). Every file becomes a model named after the file (without .bbmodel).
# The resource pack is written to plugins/Vehicle/generated/Vehicle-pack.zip - host it yourself and
# point your server.properties resource-pack / resource-pack-sha1 at it (sha1 is in Vehicle-pack.sha1).

# Vehicles are invisible armor stands (gravity, block collision, step height, hitbox; no AI, no sounds). With
# invincible: true they take no damage at all - players, bullets, explosions, fire, crashes and ramming leave them
# intact. false (default) = the health pool (crash damage, destroyed at zero health). Vehicles made before 1.5.0
# (invisible pigs) are rebuilt as armor stands automatically when their chunk loads.
invincible: false
# hitbox (per type) is the HEIGHT of the collision box; an armor stand is 4x taller than wide, so the width is ~1/4.

# The vanilla item whose look is replaced by the vehicle models (players never see it, only its models).
base-item: minecraft:turtle_scute

# Global rider height nudge in blocks, added to every seat's y. Per-seat y is set with /vehicle edit.
seat-rider-offset: 0.6

# Sneak + right-click an EMPTY vehicle you own (or any vehicle with vehicle.admin) to pick it up as an item.
pickup-enabled: true

# Vehicle items given with /vehicle give are consumed when placed (creative players keep theirs).
consume-item-on-place: true

pack:
  # composite (default): every Blockbench group and every freely rotated cube is its own sub-model placed by an
  # exact display transform - no 22.5 degree rounding, no shrinking of big models. baked: the old single-model mode.
  mode: composite
  frame-ticks: 1         # animation frames: one per tick unless the animation has Blockbench snapping
  max-frames: 40         # cap per animation
  # Animation channel signs relative to the rest pose. Default "auto": Blockbench 4.x files (format_version 4.*) use
  # rotation [-1,-1,1] and position [-1,1,1] (Bedrock convention), Blockbench 5 files [1,1,1]. Override with a list:
  # anim-rotation-sign: [-1, -1, 1]
  # anim-position-sign: [-1, 1, 1]
  description: "Vehicle models (generated)"
  min-format: 46
  max-format: 999

crash:
  # Bumping into something slower than this (blocks/s) is harmless.
  min-speed: 4.0
  # Vehicle health lost per block/s of impact speed.
  vehicle-damage: 1.5
  # Damage (half-hearts) riders take per block/s above min-speed.
  rider-damage: 0.6
  # Damage dealt to mobs/players that get rammed, per block/s of vehicle speed.
  ram-damage: 0.8
  # Vehicle health lost per block fallen beyond 3 blocks.
  fall-damage: 4.0
  # Vehicles explode (particles + sound, no block damage) and disappear when their health reaches 0.
  destroy-at-zero-health: true

drive:
  animation-follows-speed: true   # the drive animation speed follows the vehicle speed
  animation-full-speed: 0         # blocks/s at which the animation runs at Blockbench speed (0 = the type's max speed)
  # Show "speed | health" on the driver's action bar.
  speedometer: true
  # Riders who leave step out beside the vehicle instead of on top of it.
  exit-beside: true
  # Speed factor while the vehicle is in water.
  water-speed-factor: 0.3
